name: Website readiness
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install isolated SQL test runtime
        run: npm install --prefix tmp/matching-tests --no-save --ignore-scripts @electric-sql/pglite@0.5.10
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
