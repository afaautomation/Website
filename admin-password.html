<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Set your password — Kompetenzen</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#080e19;color:#e8eef9;font:16px/1.6 system-ui,sans-serif}
    main{width:100%;max-width:460px;padding:36px;border:1px solid #2a3b53;border-radius:22px;background:#111c2d;box-shadow:0 24px 80px #0005}
    .brand{color:#73b5ff;font-weight:700;letter-spacing:.06em}h1{font-size:28px;margin:14px 0 8px;line-height:1.2}p{color:#aebed3}label{display:block;margin:18px 0 8px;font-weight:600}
    input,button{width:100%;padding:14px;border-radius:10px;font:inherit}input{background:#0b1423;border:1px solid #52627a;color:#fff}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #83bdff;outline-offset:3px}
    button{margin-top:24px;border:0;background:#285aeb;color:white;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:wait}a{color:#94c8ff}#password-message{min-height:26px}#password-message[data-error="true"]{color:#ffb4b4}[hidden]{display:none!important}
  </style>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js" integrity="sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP" crossorigin="anonymous"></script>
  <script src="supabase-config.js"></script>
</head>
<body>
  <main>
    <div class="brand">KOMPETENZEN · STAFF</div>
    <h1>Set your password</h1>
    <p>Choose a unique password with at least 12 characters. A short phrase is easy to remember.</p>
    <p id="password-message" role="status" aria-live="polite">Checking your invitation or reset link…</p>
    <form id="password-form" hidden>
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <label for="confirm-password">Confirm password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required>
      <button type="submit" id="save-password">Save password</button>
    </form>
    <p><a href="admin.html">Back to staff login</a></p>
  </main>
  <script src="js/admin-password.js"></script>
</body>
</html>
